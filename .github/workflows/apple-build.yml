name: Build project_proxy3d for Apple (macOS)

# 桌面平台之一：Apple 桌面（macOS）。
# 游戏已完整迁移到 C#，运行时依赖 CLR/MonoVM；joy 仓只提供 macOS 版
# libcoreclr.dylib，且 iOS/tvOS/visionOS 禁止 JIT 与动态库加载，无法承载 CLR，
# 故只构建 macOS 桌面目标（原 iOS/tvOS/visionOS 矩阵已移除）。
# 对齐 joy examples 的 desktop.yml：macos-15 + Xcode + 单 arm64 + .NET 8 SDK。
# 由原 _ci/build.yml 的 build-mac job 拆分而来；单仓库只构建本项目目标 project_proxy3d。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-mac:
    name: Build for macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "16.1"

      # C# 模块（CSharp/）的 dotnet restore/build 依赖 .NET SDK。
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure
        run: |
          # 只有 macos-arm64 runtime pack，双架构会在链接 x86_64 切片时失败。
          cmake -G "Xcode" \
                -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -S . -B build

      - name: Build
        run: cmake --build build --target project_proxy3d --config Release

      - name: Ad-Hoc Codesign
        run: |
          codesign -s - -f "./build/Release/project_proxy3d.app" --deep

      - name: Create DMG
        run: |
          cd build
          hdiutil create -volname project_proxy3d_apple_macOS \
            -srcfolder Release \
            project_proxy3d_apple_macOS.dmg

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: project_proxy3d-apple-macOS
          retention-days: 7
          path: build/*.dmg
