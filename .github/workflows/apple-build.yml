name: Build project_proxy3d for Apple

# 桌面平台之一：Apple（iOS / tvOS / visionOS / macOS，矩阵；空字符串代表 macOS 桌面）。
# 由原 _ci/build.yml 的 build-mac job 拆分而来；单仓库只构建本项目目标 project_proxy3d。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-mac:
    name: Build for Apple (${{ matrix.target == '' && 'macOS' || matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [iOS, tvOS, visionOS, '']      # '' 表示 macOS 本地
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "16.1"

      - name: Configure
        run: |
          EXTRA=""
          if [ -n "${{ matrix.target }}" ]; then EXTRA="-DCMAKE_SYSTEM_NAME=${{ matrix.target }}"; fi
          cmake -G "Xcode" \
                -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
                $EXTRA \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -S . -B build

      - name: Build
        run: cmake --build build --target project_proxy3d --config Release

      - name: Ad-Hoc Codesign
        run: |
          codesign -s - -f "./build/Release/project_proxy3d.app" --deep

      - name: Create DMG
        run: |
          cd build
          TARGET="${{ matrix.target }}"
          if [ -z "$TARGET" ]; then TARGET="macOS"; fi
          hdiutil create -volname project_proxy3d_apple_$TARGET \
            -srcfolder Release \
            project_proxy3d_apple_$TARGET.dmg

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: project_proxy3d-apple-${{ matrix.target == '' && 'macOS' || matrix.target }}
          retention-days: 7
          path: build/*.dmg
