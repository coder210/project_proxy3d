name: Build project_proxy3d for Android

# 独立仓库：SDL 的 Android 工程位于 third_party/joy/SDL/android-project。
# 游戏根 CMakeLists 从 app/ 向上 5 层（app -> android-project -> SDL -> joy -> third_party -> 仓库根）。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # 引擎仓 joy 目前是私有：需要 SUBMODULE_TOKEN（对 joy 有 Contents:Read 的 PAT）。
          # 引擎公开后这行可保留，会自动回落到 github.token。
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Maven Central 对 GitHub Actions 共享出口 IP 限流（HTTP 429）。AGP 的
      # 第三方传递依赖（protobuf/gson/guava/grpc...）只在 Maven Central，
      # Google Maven 没有。缓存 Gradle 依赖：首次成功后后续 run 从缓存读，
      # 不再请求 Maven Central。
      - name: Setup Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # vendored SDL 的 gradle-wrapper.jar 不在官方校验白名单里，
          # 这里只依赖它的依赖缓存能力，不需要 wrapper 校验。
          validate-wrappers: false

      - name: Copy build.gradle to SDL project
        run: cp build.gradle third_party/joy/SDL/android-project/app/

      - name: Patch build.gradle for standalone layout
        run: |
          cd third_party/joy/SDL/android-project/app/

          # 游戏根 CMakeLists（5 层）
          sed -i 's#\.\./\.\./\.\./CMakeLists.txt#../../../../../CMakeLists.txt#' build.gradle

          # 传入 MOBILE_MAIN_DIR，游戏 CMake 据此推导 MOBILE_ASSETS_DIR
          sed -i 's#-DANDROID_APP_PLATFORM=android-16"#-DANDROID_APP_PLATFORM=android-16", "-DMOBILE_MAIN_DIR=${System.getProperty("user.dir")}/app/src/main"#' build.gradle

          grep -nE "path |arguments " build.gradle

      - name: Add copyIcons task to build.gradle
        run: |
          cd third_party/joy/SDL/android-project/app/
          cat >> build.gradle << 'EOF'

          task copyIcons {
              doLast {
                  def densities = ['hdpi', 'mdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']
                  def sourceFile = file('../../../../../assets/logo.png')
                  if (!sourceFile.exists()) {
                      throw new GradleException("assets/logo.png not found at ${sourceFile.absolutePath}")
                  }
                  densities.each { density ->
                      def targetDir = file("src/main/res/mipmap-${density}")
                      if (!targetDir.exists()) {
                          targetDir.mkdirs()
                      }
                      copy {
                          from sourceFile
                          into targetDir
                          rename '.*', 'ic_launcher.png'
                      }
                  }
              }
          }

          preBuild.dependsOn copyIcons

          if (project.hasProperty('appDisplayName')) {
              android.defaultConfig {
                  resValue "string", "app_name", project.appDisplayName
              }
          }

          android.applicationVariants.all { variant ->
              variant.outputs.all { output ->
                  def targetName = project.hasProperty('targetName') ? project.targetName : 'Game'
                  def buildType = variant.buildType.name
                  outputFileName = "${targetName}-${buildType}.apk"
              }
          }
          EOF

      - name: Inject android:roundIcon (MIUI/HyperOS 仅声明 android:icon 时会显示空白图标)
        run: |
          cd third_party/joy/SDL/android-project/app/src/main/
          if ! grep -q 'android:roundIcon' AndroidManifest.xml; then
            sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher"#' AndroidManifest.xml
          fi
          grep -n 'android:icon\|android:roundIcon' AndroidManifest.xml

      - name: Build APK
        run: |
          cd third_party/joy/SDL/android-project/
          chmod +x gradlew

          # root build.gradle 的 buildscript/allprojects 都是 mavenCentral()，
          # 对 GitHub Actions 出口 IP 会 429。AGP 自身的依赖在 google()，
          # 第三方传递依赖只在 Maven Central —— 换成它的完整镜像。
          # 只改 checkout 出来的副本，不动仓库文件。
          n=$(grep -c 'mavenCentral()' build.gradle || true)
          [ "$n" -eq 2 ] || { echo "::error::expected 2 mavenCentral() in root build.gradle, found $n"; exit 1; }
          sed -i "s#mavenCentral()#maven { url 'https://maven.aliyun.com/repository/public' }#g" build.gradle
          grep -n 'maven\|google' build.gradle

          # 镜像偶发抖动时重试；已下载的依赖留在 Gradle 缓存，重试只补失败项。
          rc=1
          for attempt in 1 2 3 4; do
            echo "--- gradlew assembleDebug (attempt $attempt) ---"
            ./gradlew assembleDebug -PtargetName=project_proxy3d -PappDisplayName="Project Proxy 3D"
            rc=$?
            [ "$rc" -eq 0 ] && break
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 40))
              echo "::warning::gradlew failed ($rc), retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          exit "$rc"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project_proxy3d-debug
          retention-days: 7
          path: third_party/joy/SDL/android-project/app/build/outputs/apk/debug/project_proxy3d-debug.apk
